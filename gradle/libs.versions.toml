# CallowFellow version catalog (Amper reads gradle/libs.versions.toml
# from the project root, access via $libs.* in module.yaml).
# Toolchain catalogs ($compose, $kotlin) are intentionally NOT duplicated here —
# their versions come from the Kotlin Toolchain (see kotlin wrapper,
# kotlin_cli_version), not from us.
# Single source of truth for the app version is [versions].app / [versions].app-code
# below. androidApp/module.yaml (versionName/versionCode) and
# shared/src/task3/domain/AppVersion.kt mirror these values literally
# (Amper settings cannot reference $libs.versions dynamically).

[versions]
# App version. Bump on every release; keep in sync with
# androidApp/module.yaml and AppVersion.kt.
app = "0.1.0"
app-code = "1"
coroutines = "1.10.2"
serialization = "1.11.0"
room = "2.8.5"
sqlite = "2.7.1"
material-icons = "1.7.3"
activity-compose = "1.8.2"
koog-deepseek = "1.3.0-beta"
koog-http-ktor = "1.3.0"
ktor = "3.1.3"
okio = "3.18.2"
litertlm = "0.18.0"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "material-icons" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
koog-deepseek-client = { module = "ai.koog:prompt-executor-deepseek-client", version.ref = "koog-deepseek" }
koog-http-ktor = { module = "ai.koog:http-client-ktor", version.ref = "koog-http-ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }
litertlm-jvm = { module = "com.google.ai.edge.litertlm:litertlm-jvm", version.ref = "litertlm" }
